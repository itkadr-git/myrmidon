services:
  db:
    # SHARED-PG: one PostgreSQL 18 with pgvector serves the board and the
    # shared services (litellm, langfuse, hindsight). The extra databases and
    # roles are created on first start by an init script in
    # docker-entrypoint-initdb.d (the installer generates it); a manual
    # `docker compose up` without those MYRMIDON_<SERVICE>_PASSWORD values
    # gets only the board database. For a local dev stack keep the trivial
    # paperclip/paperclip credentials of the server block below.
    image: docker.io/pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperclip}
      POSTGRES_DB: paperclip
      MYRMIDON_SHARED_SERVICES: ${MYRMIDON_SHARED_SERVICES:-litellm langfuse hindsight}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 keeps the cluster one level deeper
      # (/var/lib/postgresql/18/docker), so the volume is mounted at the
      # image's declared VOLUME path, not .../data.
      - pgdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    # No `init: true` here on purpose. The image makes tini PID 1 itself
    # (Dockerfile ENTRYPOINT), which covers every launch path -- compose, plain
    # `docker run`, the quadlet units and the ECS task definition -- instead of
    # one lever per orchestrator. Setting it here too would nest docker-init
    # around tini and make tini warn that it is not PID 1 on every boot.
    # pids_limit is the backstop: if something ever does leak processes again,
    # this container hits its own ceiling and dies visibly rather than starving
    # the whole host of pids.
    pids_limit: 2048
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: "postgres://paperclip:${POSTGRES_PASSWORD:-paperclip}@db:5432/paperclip"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
