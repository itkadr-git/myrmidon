# myrmidon(1.6.6 C-MEM): the managed memory service of an execution site.
#
# hs-pg (PostgreSQL 18 + pgvector) and hindsight-work (the work-memory API) run on the site next
# to fleetd, so the bots of the site recall and retain locally and never go over the link to the
# board. This file is the canonical definition: the operator brings it up once per site and the
# site-agent (fleetd) reaches hindsight-work at http://127.0.0.1:8890 (memory.url in fleetd.json).
#
# Everything site-specific comes from two profile files placed in ./profile on the site (examples
# next to this file; operator guide, section 4.5):
#   profile/hindsight-work.env  the hindsight settings (LLM and embeddings through the gateway named by the site profile's llmBaseUrl)
#   profile/hs-pg.env           POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# No secret is in this file. Images are pinned by digest through variables with no default, so a
# missing pin stops `docker compose up` instead of pulling a floating tag.
#
#   docker compose -f docker-compose.yml --env-file profile/images.env up -d
name: myrmidon-site-memory

services:
  hs-pg:
    image: ${HS_PG_IMAGE:?set HS_PG_IMAGE to a digest-pinned pgvector/pgvector image}
    container_name: hs-pg
    restart: unless-stopped
    env_file:
      - ./profile/hs-pg.env
    volumes:
      # PostgreSQL 18 keeps the cluster below /var/lib/postgresql.
      - hs-pg-data:/var/lib/postgresql
    networks: [site-memory]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    pids_limit: 512

  hindsight-work:
    image: ${HINDSIGHT_IMAGE:?set HINDSIGHT_IMAGE to a digest-pinned hindsight image}
    container_name: hindsight-work
    restart: unless-stopped
    depends_on:
      hs-pg:
        condition: service_healthy
    env_file:
      - ./profile/hindsight-work.env
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "false"
    ports:
      # Loopback only: fleetd on the same host is the one client; nothing is published to the network.
      - "127.0.0.1:8890:8888"
    networks: [site-memory]
    mem_limit: 4g
    pids_limit: 1024

networks:
  site-memory:
    name: myrmidon-site-memory

volumes:
  hs-pg-data:
    name: myrmidon-site-hs-pg-data
