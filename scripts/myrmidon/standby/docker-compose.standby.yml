# Docker Compose for Myrmidon center warm standby on myr-vm1 (T9).
# Single PostgreSQL 18 standby cluster replicating vm-core myrmidon-pg
# containing both 'paperclip' and 'myrmidon_hindsight' databases.
# Standby data directory and authentication are provisioned by standby-ctl.mjs setup
# (pg_basebackup + streaming replication passfile in /var/lib/postgresql/data/.pgpass).
services:
  myrmidon-pg-standby:
    image: pgvector/pgvector:pg18
    container_name: myrmidon-pg-standby
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /srv/standby/myrmidon-pg/data:/var/lib/postgresql/data
      - /srv/backups/wal/myrmidon-pg:/srv/backups/wal:ro
    environment:
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
      -c hot_standby=on
      -c restore_command='cp /srv/backups/wal/%f %p'
      -c hot_standby_feedback=on
      -c max_connections=200
      -c max_worker_processes=16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U paperclip && psql -U paperclip -d paperclip -c 'SELECT pg_is_in_recovery();' | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # D6: board service for rehearsal drill verification.
  # Runs only during rehearse --keep-drill; points at the ephemeral drill
  # postgres on host port 5533. No scheduler, no outgoing channels.
  myrmidon-board:
    image: ghcr.io/itkadr-git/myrmidon:latest
    container_name: myrmidon-board-drill
    restart: "no"
    ports:
      - "127.0.0.1:3101:3100"
    environment:
      DATABASE_URL: "postgres://paperclip:${PAPERCLIP_DB_PASSWORD:-paperclip}@host.docker.internal:5533/paperclip"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_DISABLE_SCHEDULER: "true"
      PAPERCLIP_DISABLE_OUTBOUND: "true"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      myrmidon-pg-standby:
        condition: service_healthy
