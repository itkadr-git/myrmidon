# Hardening drop-in for the fleetd unit of docs/myrmidon/guides/remote-execution-sites.md
# (section 4.2). The unit itself is documented there; this file only adds sandboxing.
#
# Install:
#   install -D -m 0644 hardening.conf /etc/systemd/system/myrmidon-fleetd.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart myrmidon-fleetd
# Check:
#   systemd-analyze security myrmidon-fleetd
#   journalctl -u myrmidon-fleetd -n 20
#
# What fleetd needs, read from tools/fleetd/cmd/fleetd:
# - Writes only below `volumeRoot` of fleetd.json: the bot volumes, the staging
#   directory of a restore, and the ".replaced-*" and ".quarantined-*" directories
#   that restore and quarantine move aside (the clean-up removes them again).
#   Nothing is written to /var/lib, /tmp, /etc or /run.
# - Talks to Docker through the socket named by `upstream` (default
#   /var/run/docker.sock). Connecting to a socket works on a read-only file system,
#   so the socket needs no ReadWritePaths entry.
# - Reads fleetd.json, the PKI files, /proc/meminfo and the cgroup files
#   (memory.events) of the bot containers.
# - Works on files that belong to the bot user: it hands restored and written
#   files to that user (CAP_CHOWN), reads and writes files and directories of mode
#   0600 or 0700 (CAP_DAC_OVERRIDE), changes modes and removes entries it does
#   not own (CAP_FOWNER), and keeps set-id bits on a change of owner (CAP_FSETID).
#
# Adjust before use:
# - ReadWritePaths must be the `volumeRoot` of fleetd.json. If the volumes are on
#   the XFS quota file system, write that path (for example
#   /srv/myrmidon-xfs/myrmidon-bots). The directory must exist before the unit
#   starts; systemd refuses to start the unit when it is missing.
# - A `listen` port below 1024 needs CAP_NET_BIND_SERVICE in the bounding set.
#   The documented port, 9100, does not.
# - UMask=0077 makes files and directories that fleetd creates private to the
#   owner. Restored and written bot files belong to the bot user, so the bot sees
#   no difference. Check the first restore after you enable the drop-in.

[Service]
ProtectSystem=strict
ReadWritePaths=/srv/myrmidon-bots
NoNewPrivileges=yes
PrivateTmp=yes
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_FSETID
UMask=0077
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
