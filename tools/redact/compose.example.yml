services:
  redact:
    build:
      context: .
      target: service
    image: ghcr.io/itkadr-git/myrmidon-redact:latest
    container_name: myrmidon-redact
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDACT_HOST=0.0.0.0
      - REDACT_PORT=8080
      - REDACT_MODE=flag
      - REDACT_THRESHOLD=0.85
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
