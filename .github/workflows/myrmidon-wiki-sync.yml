name: Myrmidon wiki sync

# Publishes the wiki sources in docs/wiki/ to the GitHub wiki repository
# (itkadr-git/myrmidon.wiki). Runs on every push to main that touches
# docs/wiki/** and on every published release, so the wiki follows the
# repository and each release without manual steps.
#
# Authentication: the job pushes to the .wiki.git repository over HTTPS with
# the WIKI_SYNC_TOKEN secret — a classic personal access token of a user who
# can write this repository, with the `repo` scope. Fine-grained PATs do not
# cover the wiki git repository (GitHub's fine-grained permission set has no
# wiki endpoint, and pushing to <repo>.wiki.git with a fine-grained PAT is
# refused), so the token must be classic. The first wiki page is created by
# hand on GitHub: the wiki repository does not exist until then, and neither
# the API nor a git push can initialize it.
#
# After the sync the job probes every synced page over HTTP: a page that does
# not answer 200 fails the run.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: myrmidon-wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: ${{ github.repository == 'itkadr-git/myrmidon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Clone the wiki repository
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          git clone "https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Mirror docs/wiki into the wiki repository
        run: |
          # Keep only files that still exist in docs/wiki/: the wiki mirrors
          # the source directory, so pages deleted from the repo leave the
          # wiki too.
          find wiki -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp docs/wiki/*.md wiki/

      - name: Commit and push when pages changed
        working-directory: wiki
        run: |
          git config user.name "myrmidon-wiki-sync"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki/; nothing to push."
            exit 0
          fi
          git commit -m "Sync wiki from docs/wiki/ @ ${{ github.sha }}"
          git push origin HEAD:master

      - name: Probe the synced pages (HTTP 200)
        run: |
          set -e
          failed=0
          for f in docs/wiki/*.md; do
            page="$(basename "$f" .md)"
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://github.com/${{ github.repository }}/wiki/${page}")"
            echo "${page}: ${code}"
            if [ "$code" != "200" ]; then
              failed=1
            fi
          done
          if [ "$failed" != "0" ]; then
            echo "::error::Some wiki pages did not answer 200 after the sync."
            exit 1
          fi
