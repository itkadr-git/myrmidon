name: Release freeze gate

# RELEASE-FREEZE (the 1.6.4 incident, 04.10): between the release cut and a
# green Myrmidon CI on the release tag, merges into main are frozen — bots
# merging #475 + three more PRs one minute after the 1.6.4 tag cancelled the
# tag's CI run and the autopublish refused. This workflow is the merge gate;
# the freeze STATE (an open issue titled "release-freeze: <tag>") is created
# and cleared by the freeze job added to myrmidon-release.yml (the tag
# workflow) — see scripts/myrmidon/release/release-freeze.sh.
#
# The gate is fail-closed: any lookup error (no token, API failure) counts as
# "freeze active", so a broken gate blocks merges instead of waving them
# through during a release window. Operator: to make the freeze binding, add
# this check ("freeze" of "Release freeze gate") to the required status
# checks of main; without that it is advisory only (red, but mergeable by
# admins).

# OPE-10063: the gate is computed once per pull_request event, so a PR checked
# while the CI of a release tag ran stayed red after the freeze lifted (30.10:
# `freeze` was red on every open PR while the CI of rc.19 ran). When "Myrmidon
# CI (tag)" completes, the second job re-runs the failed gate runs of the open
# PRs if the gate is open again (scripts/myrmidon/release/release-freeze-rerun.sh).
# workflow_run workflows are taken from the default branch.

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Myrmidon CI (tag)"]
    types: [completed]

permissions:
  contents: read
  issues: read

jobs:
  freeze:
    name: freeze
    if: ${{ github.repository == 'itkadr-git/myrmidon' && github.event_name == 'pull_request' }}
    # Light gate: own pool (vars.CI_RUNNER_LIGHT, same as `plan`), the GitHub-hosted queue is hours long.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIGHT || vars.MYR_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Ensure gh and jq (self-hosted runners may lack them)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools-bin"; mkdir -p "$bin"
          if ! command -v jq >/dev/null; then
            curl -fsSL -o "$bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$bin/jq"
          fi
          if ! command -v gh >/dev/null; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/gh_2.62.0_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fail while the release freeze is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/myrmidon/release/release-freeze.sh --check

  rerun-failed-freeze:
    name: re-run failed freeze gates
    if: ${{ github.repository == 'itkadr-git/myrmidon' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Re-run the failed gate runs of open pull requests once the freeze is lifted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/myrmidon/release/release-freeze-rerun.sh
