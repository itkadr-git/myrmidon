name: Myrmidon hot files review

# myrmidon(R1): решение владельца 28.09.2026 — PR, которые трогают ключевые файлы ядра, сливаются
# только после ревью. Все действия в репозитории идут от одной учётки, поэтому одобрение GitHub
# здесь не работает; вместо него — метка `review-approved`, которую ставит роль ревьюера
# (adm-dev-review) или сопровождающий после ревью. Новый push снимает метку: ревью относится
# к конкретному коду.
#
# A waiting review is not a failure. The job never fails while review is pending: a red run
# emails the repo owner on every hot-files PR. Instead, it reports a commit status with
# context `hot-files-review` (required by the ruleset):
#   - pending  - hot files touched, review-approved label not present yet;
#   - success  - the label is present, or no hot files touched.
# The job itself always ends green.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  hot-files-review:
    name: hot files review
    runs-on: ${{ fromJSON(vars.MYR_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Ensure gh and jq (self-hosted runners may lack them)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools-bin"; mkdir -p "$bin"
          if ! command -v jq >/dev/null; then
            curl -fsSL -o "$bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$bin/jq"
          fi
          if ! command -v gh >/dev/null; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/gh_2.62.0_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check hot files and review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          hot='^(server/src/services/heartbeat\.ts|server/src/services/execution-continuation\.ts|server/src/services/legacy-execution-recovery\.ts|server/src/services/tool-gateway\.ts|server/src/routes/tool-gateway\.ts|server/src/services/redaction\.ts|server/src/services/native-runtime/runtime-context\.ts|server/src/services/issues\.ts|server/src/routes/issues\.ts|server/src/services/chat-channels\.ts|packages/adapters/hermes/.*|packages/db/.*|scripts/myrmidon/deploy/.*|server/src/myrmidon/bot-containers/(docker-driver|template|ustar|routes)\.ts|server/src/myrmidon/agent-self-update\.ts|tools/dockergate/.*|docker/dockergate/.*|scripts/myrmidon/dockergate/.*|Dockerfile|\.github/workflows/.*)$'
          touched="$(grep -E "$hot" <<<"$files" || true)"
          if [[ -z "$touched" ]]; then
            echo "Ключевые файлы не затронуты — ревью не обязательно."
            gh api -X POST "repos/$REPO/statuses/$SHA" -f state='success' -f context='hot-files-review' -f description='no hot files touched' >/dev/null
            exit 0
          fi
          echo "Затронуты ключевые файлы:"; echo "$touched"
          if [[ "$ACTION" == "synchronize" ]]; then
            # myrmidon-pr-autoupdate merges main into the branch; its approved
            # pull_request run is a `synchronize` too, but the PR's own code
            # did not change, so the label stays (merge commit made by
            # github-actions[bot] through the update-branch API).
            head="$(gh api "repos/$REPO/commits/$SHA" --jq '[(.parents|length),.author.login,.committer.login,(.commit.message|split("\n")[0])]|@tsv')"
            if [[ "$head" =~ ^2$'\t'github-actions\[bot\]$'\t'web-flow$'\t'Merge\ branch\ \'main\'\ into\  ]]; then
              echo "Head — слияние main от myrmidon-pr-autoupdate: метка review-approved остаётся."
            else
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/review-approved" >/dev/null 2>&1 || true
              echo "Новый push после ревью — метка review-approved снята, нужно повторное ревью."
            fi
          fi
          labels="$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')"
          if grep -qx 'review-approved' <<<"$labels"; then
            echo "Метка review-approved есть — ревью пройдено."
            gh api -X POST "repos/$REPO/statuses/$SHA" -f state='success' -f context='hot-files-review' -f description='review-approved' >/dev/null
          else
            echo "PR трогает ключевые файлы ядра: нужна метка review-approved после ревью."
            gh api -X POST "repos/$REPO/statuses/$SHA" -f state='pending' -f context='hot-files-review' -f description='waiting for review-approved' >/dev/null
          fi
