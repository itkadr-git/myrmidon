name: Myrmidon hot files review

# myrmidon(R1): решение владельца 28.09.2026 — PR, которые трогают ключевые файлы ядра, сливаются
# только после ревью. Все действия в репозитории идут от одной учётки, поэтому одобрение GitHub
# здесь не работает; вместо него — метка `review-approved`, которую ставит роль ревьюера
# (adm-dev-review) или сопровождающий после ревью. Новый push снимает метку: ревью относится
# к конкретному коду.
#
# A waiting review is not a failure. The job never fails while review is pending: a red run
# emails the repo owner on every hot-files PR. Instead, it reports a commit status with
# context `hot-files-review` (required by the ruleset):
#   - pending  - hot files touched, review-approved label not present yet;
#   - success  - the label is present, or no hot files touched.
# The job itself always ends green.
#
# Merge queue: the queue checks the candidate commit, not the PR. Review is
# enforced on the PR, so for a `merge_group` event the job only reports the
# `hot-files-review` status as success on the candidate and leaves the queue
# moving. See docs/myrmidon/merge-queue.md.

# Trigger only on label events: on push (opened/synchronize/reopened) and merge_group,
# the plan job in myrmidon-ci.yml already checks hot files and sets the status check.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: myrmidon-hot-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hot-files-review:
    name: hot files review
    if: ${{ github.event.label.name == 'review-approved' || github.event.action == 'unlabeled' }}
    # Light gate: own pool (vars.CI_RUNNER_LIGHT, same as `plan`), the GitHub-hosted queue is hours long.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIGHT || vars.MYR_RUNNER_LIGHT || vars.MYR_RUNNER || '"vps-ci"') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Ensure gh and jq (self-hosted runners may lack them)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools-bin"; mkdir -p "$bin"
          if ! command -v jq >/dev/null; then
            curl -fsSL -o "$bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$bin/jq"
          fi
          if ! command -v gh >/dev/null; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/gh_2.62.0_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check hot files and review label
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ./scripts/myrmidon/ci/hot-files-check.sh
