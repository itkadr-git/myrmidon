name: Main green gate

# OPE-12889: the gate verdict comes from the latest COMPLETED Myrmidon CI run on
# main, so a run still in flight no longer blocks PR merges or marks the gate red.
#

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Myrmidon CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # OPE-12889: Myrmidon CI workflow_run events fire for every branch, so the old
  # shared group with cancel-in-progress kept cancelling the rerun lane
  # mid-flight. PR runs cancel only their own superseded run; the rerun lane
  # (workflow_run/schedule/dispatch) has its own group and never cancels.
  group: myrmidon-main-green-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'rerun' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && true || false }}

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  main-green:
    name: main-green
    if: ${{ github.repository == 'itkadr-git/myrmidon' && github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIGHT || vars.MYR_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Ensure gh and jq (self-hosted runners may lack them)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools-bin"; mkdir -p "$bin"
          if ! command -v jq >/dev/null; then
            # Release assets via the authenticated API: anonymous github.com downloads fail with 504 when GitHub throttles anonymous traffic.
            curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$bin/jq" https://api.github.com/repos/jqlang/jq/releases/assets/140520984
            chmod +x "$bin/jq"
          fi
          if ! command -v gh >/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/gh.tar.gz" https://api.github.com/repos/cli/cli/releases/assets/206502108
            tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/gh_2.62.0_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fail while main CI is red or pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/myrmidon/ci/main-green-gate.sh --check

  disarm-on-red-main:
    name: disarm auto-merge on red main
    if: ${{ github.repository == 'itkadr-git/myrmidon' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Disable native auto-merge unless current main is green
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/myrmidon/ci/main-green-disarm.sh

  rerun-failed-main-green:
    name: re-run failed main-green gates
    needs: disarm-on-red-main
    if: ${{ github.repository == 'itkadr-git/myrmidon' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Re-run failed main-green checks of open pull requests once main is green
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/myrmidon/ci/main-green-rerun.sh
