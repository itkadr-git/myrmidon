name: Myrmidon CI (tag)

# TAG-CI (the 1.6.4 incident): the full Myrmidon CI runs on every release
# tag push as its own, un-cancellable run. On 05.10 the tag myr-v1.6.4 was
# pushed and a minute later bots merged 4 PRs into main: the main push
# superseded and cancelled the CI run of the tag's commit (myrmidon-ci.yml
# groups by github.ref — same sha, same group, cancel-in-progress: true),
# so the automatic publish had no green run and refused; the tag CI had to
# be re-run by hand (workflow_dispatch run 37277281522) and the release was
# published manually.
#
# This workflow is the full tier of myrmidon-ci.yml without the plan/tier
# split (a release tag always runs the full pipeline), but:
#   - it triggers on release tags (`myr-v*.*.*`, including `-rc.N`),
#   - its concurrency group is keyed by the TAG ref with
#     cancel-in-progress: false — a push to main can never cancel it,
#   - its `CI result` is the ONLY source of green the publish gate accepts
#     (publish-github-release.sh refuses a tag whose tag-CI run is missing,
#     failed or cancelled; a green main run of the same commit no longer
#     counts),
#   - every job routes to the priority runner pool (vars.CI_RUNNER_PRIORITY)
#     ahead of queued ordinary runs — a release tag build never waits behind
#     an ordinary build (OPE-13002). If the priority pool is NOT configured,
#     the `Verify release build queue priority` step fails the run closed:
#     a release without a guaranteed priority queue must not ship.
#
# CI-TAG-REUSE-BRANCH-RUN (16.11): the first job (`reuse-check`) looks for a
# green full run of myrmidon-ci.yml on the SAME commit (the head of the rel
# branch). When it exists (waited for while it runs) the lanes are skipped and
# `CI result` is success; with no such run, or a red one, the full pipeline
# below runs as before. A CANCELLED branch run is not a red verdict: it is
# waited for like a running one, because its canonical next state is a re-run
# that can turn green (rc.12/rc.13 of 1.6.9: the branch run cancelled at the
# tag cut went green on the re-run before the duplicate pipeline finished).
# See docs/myrmidon/changes/ci-tag-reuse-branch-run.md.
#
# The job bodies are kept in sync with myrmidon-ci.yml by
# scripts/myrmidon/release/release-publish.test.mjs (the "tag CI workflow"
# block). When a lane of myrmidon-ci.yml changes, change it here too.

on:
  push:
    tags:
      - "myr-v*.*.*"
  workflow_dispatch:
    # Manual fallback path (the 1.6.4 recovery): re-run the tag CI by hand.
    # OPE-13002 verification path: the input also accepts a commit SHA — a
    # dispatch then runs this full tag CI on that exact head (every lane,
    # including the matrix/other/runner test tiers the PR workflow skips).
    # Such a run is not a release: the release changelog gate skips it.
    inputs:
      tag:
        description: Release tag to run CI for (e.g. myr-v1.6.4), or a commit SHA to verify this tag CI on an exact head
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Own group per tag, never cancelled by a superseding push — the whole
  # point of the workflow: the tag's run is un-cancellable.
  group: myrmidon-ci-tag-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  reuse-check:
    # CI-TAG-REUSE-BRANCH-RUN (16.11): the tag is cut on the head of a rel branch
    # whose full Myrmidon CI (myrmidon-ci.yml) already ran, or is running, on the
    # same commit; a second full pipeline of it was a pure duplicate that took the
    # same runners and doubled the release CI time. This job waits for that run
    # (scripts/myrmidon/ci/tag-ci-reuse.mjs) and decides: `reuse` (it is green:
    # every lane below is skipped and `CI result` is success) or `full` (no such
    # run, it is red, the wait timed out, or the check itself failed: the whole
    # pipeline below runs as before). A cancelled branch run is waited for like a
    # running one — it carries no code verdict and its re-run can turn green.
    name: reuse branch CI
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_LIGHT || vars.MYR_RUNNER_LIGHT || '"vps-ci"') }}
    timeout-minutes: 80
    outputs:
      mode: ${{ steps.decide.outputs.mode || 'full' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Decide reuse or full pipeline
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SCRIPT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No checkout: it fails on some self-hosted runners. Read the script of this commit through the API.
          script="$RUNNER_TEMP/tag-ci-reuse.mjs"
          if curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$script" "https://api.github.com/repos/$REPO/contents/scripts/myrmidon/ci/tag-ci-reuse.mjs?ref=$SCRIPT_REF"; then
            node "$script" --repo "$REPO" --tag "$TAG" || echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "could not read tag-ci-reuse.mjs: running the full pipeline"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    # OPE-13002: every job of the tag CI is a release build job. Route to the
    # priority runner pool (vars.CI_RUNNER_PRIORITY) ahead of queued ordinary
    # runs; the fallback chain keeps the runs-on expression valid, but the
    # ci-result job fails the run closed when CI_RUNNER_PRIORITY is unset —
    # without the priority pool there is no queue priority to guarantee. The
    # queue-priority monitor in the ci-result job asserts this wiring
    # (release-jobs.test.mjs "tag CI workflow jobs").
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || vars.CI_RUNNER_TYPECHECK || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # workflow_dispatch from a branch checks out the typed tag.
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-check
          cache-workspace-crates: false
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

  build:
    name: build
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || vars.CI_RUNNER_BUILD || '"ubuntu-latest"') }}
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-build
          cache-workspace-crates: false
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Runner issue-thread viewer
        run: pnpm --filter @myrmidon/paperclip-runner build:issue-thread

      - name: Build
        run: pnpm build

  tests:
    name: tests (${{ matrix.label }})
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || vars.CI_RUNNER_TESTS || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same split as myrmidon-ci.yml (the vendor's trusted PR CI):
        # `pnpm test:run` equals the union of the general groups and the
        # serialized server suites.
        include:
        # general-server: 6 shards balanced by recorded suite cost
        # (scripts/general-server-shard-durations.json). shard_count must equal
        # the number of entries; scripts/myrmidon/ci/general-server-shards.test.mjs
        # checks that the shards cover every suite exactly once.
          - { label: "server 1/6", mode: general, group: general-server, shard_index: 0, shard_count: 6 }
          - { label: "server 2/6", mode: general, group: general-server, shard_index: 1, shard_count: 6 }
          - { label: "server 3/6", mode: general, group: general-server, shard_index: 2, shard_count: 6 }
          - { label: "server 4/6", mode: general, group: general-server, shard_index: 3, shard_count: 6 }
          - { label: "server 5/6", mode: general, group: general-server, shard_index: 4, shard_count: 6 }
          - { label: "server 6/6", mode: general, group: general-server, shard_index: 5, shard_count: 6 }
          - { label: "workspaces-a 1/2", mode: general, group: general-workspaces-a, shard_index: 0, shard_count: 2 }
          - { label: "workspaces-a 2/2", mode: general, group: general-workspaces-a, shard_index: 1, shard_count: 2 }
          - { label: "workspaces-b", mode: general, group: general-workspaces-b }
          - { label: "serialized 1/5", mode: serialized, shard_index: 0, shard_count: 5 }
          - { label: "serialized 2/5", mode: serialized, shard_index: 1, shard_count: 5 }
          - { label: "serialized 3/5", mode: serialized, shard_index: 2, shard_count: 5 }
          - { label: "serialized 4/5", mode: serialized, shard_index: 3, shard_count: 5 }
          - { label: "serialized 5/5", mode: serialized, shard_index: 4, shard_count: 5 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest (${{ matrix.label }})
        env:
          MODE: ${{ matrix.mode }}
          GROUP: ${{ matrix.group }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "general" ]; then
            args+=(--group "$GROUP")
          fi
          if [ -n "$SHARD_COUNT" ]; then
            args+=(--shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT")
          fi
          pnpm "test:run:$MODE" -- "${args[@]}"

  tests-other:
    # Packages whose tests `pnpm test:run` does not run (hermes adapter, MCP
    # servers, several adapters...): scripts/myrmidon/ci/extra-test-lanes.json.
    name: tests (other packages)
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || vars.CI_RUNNER_TESTS_OTHER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK dependencies
        run: pnpm --filter @myrmidon/plugin-sdk ensure-build-deps

      - name: Run tests of the other packages
        run: node scripts/myrmidon/ci/affected-tests.mjs extra

  tests-runner:
    # The vendor verifies the runner in its own lane (check:all: TypeScript,
    # protocol, Rust and API authority checks).
    name: tests (runner)
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || vars.CI_RUNNER_TESTS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-runner
          cache-workspace-crates: false
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the runner
        run: pnpm --filter @myrmidon/paperclip-runner check:all

  checks:
    # Cheap checks: node:test suites of our scripts, gitleaks, the
    # internal-address scan, dependency licenses and plugin compatibility.
    # Every step runs even if an earlier one failed.
    name: checks
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_ASSET_ID: "378332058" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          else
            base="$GITHUB_SHA~1"; head="$GITHUB_SHA"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "skip_tests="
          } >> "$GITHUB_OUTPUT"
          echo "range: $base..$head"

      - name: Shellcheck deploy scripts
        run: shellcheck --version && shellcheck -x scripts/myrmidon/deploy/*.sh

      - name: Changelog gate (release tag has its version section)
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # RELEASE-CUT-CHANGELOG enforces only for a REAL release-tag ref
          # (a myr-v*.*.* tag push, or the 1.6.4 recovery dispatch re-running
          # one): a release tag must carry its folded "## X.Y.Z" section so
          # the release publish never meets a body it cannot build. A
          # workflow_dispatch pointed at a commit SHA (the OPE-13002
          # verification path: run this full tag CI on the exact head of a
          # PR) is not a release and has no version section, so the gate
          # must not judge it. The publish gate itself still refuses any
          # myr-v tag without its section, so no red tag can ship.
          case "$TAG" in
            myr-v*.*.*) ;;
            *)
              echo "Not a release-tag ref ($TAG); skipping the release changelog gate (verification dispatch on a commit)."
              exit 0
              ;;
          esac
          version="${TAG#myr-v}"
          version="${version%%-rc.*}"
          node scripts/myrmidon/release/collect-fragments.mjs --version "$version" --check

      - name: Script tests (node:test under scripts/myrmidon)
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts/myrmidon -name '*.test.mjs' -type f | sort)
          printf 'Running %s\n' "${files[@]}"
          node --test "${files[@]}"

      - name: Privileged PR gate tests (node:test)
        run: node --test .github/scripts/tests/acceptance-gate.test.mjs .github/scripts/tests/privileged-workflows.test.mjs

      - name: Secrets (gitleaks, new commits)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Release assets via the authenticated API: anonymous github.com downloads fail with 504 when GitHub throttles anonymous traffic.
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o "$RUNNER_TEMP/$archive" "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml --log-opts="$BASE..$HEAD" .

      - name: Internal addresses (private networks)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          SKIP_TESTS: ${{ steps.range.outputs.skip_tests }}
        run: |
          args=(--check private-ip --base "$BASE" --head "$HEAD")
          if [ -n "$SKIP_TESTS" ]; then args+=("$SKIP_TESTS"); fi
          node scripts/myrmidon/scan-diff.mjs "${args[@]}"

      - name: Internal addresses (forbidden patterns from the repository secret)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          MYRMIDON_FORBIDDEN_PATTERNS: ${{ secrets.MYRMIDON_FORBIDDEN_PATTERNS }}
        run: node scripts/myrmidon/scan-diff.mjs --check forbidden --base "$BASE" --head "$HEAD"

      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Licenses of production dependencies
        if: ${{ !cancelled() }}
        run: node scripts/myrmidon/check-licenses.mjs

      - name: Plugin compatibility — build plugin SDK and shared from the repository
        id: sdk
        if: ${{ !cancelled() }}
        run: pnpm --filter @myrmidon/plugin-sdk ensure-build-deps

      - name: Plugin compatibility — manifest snapshots (offline)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: pnpm --filter @myrmidon/server exec tsx ../scripts/myrmidon/plugin-compat/check.ts --fixtures-only

      - name: Plugin compatibility — installed plugins against the host
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/myrmidon/plugin-compat/install.mjs --work "$RUNNER_TEMP/plugin-compat"
          pnpm --filter @myrmidon/server exec tsx ../scripts/myrmidon/plugin-compat/check.ts --work "$RUNNER_TEMP/plugin-compat"

  fleetd:
    # tools/fleetd: gofmt, go vet and the unit tests, in the same pinned Go
    # image the fleetd image workflow builds from.
    name: fleetd
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN_GO || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      GO_IMAGE: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    steps:
      - name: Repair workspace ownership left by earlier container steps
        # Self-hosted runner: a previous job's docker step may have left
        # root-owned files in the reused workspace; checkout then cannot clean
        # it and every job on this runner fails (OPE-13494). Runs BEFORE checkout.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"
          [ -d "$ws" ] || exit 0
          foreign() { find "$ws" -not -user "$(id -u)" 2>/dev/null | head -20 || true; }
          left="$(foreign)"
          [ -n "$left" ] || exit 0
          echo "::warning::workspace $ws holds files not owned by $(id -un); first entries:"
          echo "$left"
          docker run --rm --network none --user 0:0 -v "$ws:/w" "$GO_IMAGE" \
            chown -R "$(id -u):$(id -g)" /w
          left="$(foreign)"
          if [ -n "$left" ]; then
            echo "::error::workspace $ws still holds files not owned by $(id -un) after chown:"
            echo "$left"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: go.mod has no requirements (stdlib only)
        run: |
          set -euo pipefail
          if grep -qE '^\s*(require|tool)\s' tools/fleetd/go.mod; then
            echo "tools/fleetd/go.mod must stay stdlib-only"
            exit 1
          fi

      - name: gofmt, go vet, go test
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/tools/fleetd:/src" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache "$GO_IMAGE" sh -euc '
              out="$(gofmt -l .)"
              if [ -n "$out" ]; then echo "gofmt: $out"; exit 1; fi
              go vet ./...
              go test -count=1 ./...
            '

  dockergate:
    # tools/dockergate: gofmt, go vet, the unit tests, and the contract with
    # the driver (fixtures emitted afresh from the TypeScript of this commit).
    name: dockergate
    needs: [reuse-check]
    if: ${{ needs.reuse-check.outputs.mode == 'full' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_MAIN_GO || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      GO_IMAGE: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    steps:
      - name: Repair workspace ownership left by earlier container steps
        # Self-hosted runner: a previous job's docker step may have left
        # root-owned files in the reused workspace; checkout then cannot clean
        # it and every job on this runner fails (OPE-13494). Runs BEFORE checkout.
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"
          [ -d "$ws" ] || exit 0
          foreign() { find "$ws" -not -user "$(id -u)" 2>/dev/null | head -20 || true; }
          left="$(foreign)"
          [ -n "$left" ] || exit 0
          echo "::warning::workspace $ws holds files not owned by $(id -un); first entries:"
          echo "$left"
          docker run --rm --network none --user 0:0 -v "$ws:/w" "$GO_IMAGE" \
            chown -R "$(id -u):$(id -g)" /w
          left="$(foreign)"
          if [ -n "$left" ]; then
            echo "::error::workspace $ws still holds files not owned by $(id -un) after chown:"
            echo "$left"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: go.mod has no requirements (stdlib only)
        run: |
          set -euo pipefail
          if grep -Eq '^\s*require\b' tools/dockergate/go.mod || [ -e tools/dockergate/go.sum ]; then
            echo "::error::tools/dockergate must depend on the standard library only"
            exit 1
          fi

      - name: gofmt, go vet, go test (checked-in fixtures)
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/tools/dockergate:/src" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache "$GO_IMAGE" sh -euc '
              out="$(gofmt -l .)"
              if [ -n "$out" ]; then echo "gofmt: $out"; exit 1; fi
              go vet ./...
              go test -count=1 ./...
            '

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract with the driver (fixtures emitted from this commit)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dockergate-contract"
          rm -rf "$out" && mkdir -p "$out"
          pnpm --filter @myrmidon/server exec tsx ../tools/dockergate/contract/emit-fixtures.ts "$out"
          # The static fixtures must equal the checked-in ones; traffic.json
          # carries wall-clock mtimes and is only replayed, not compared.
          diff -r -x traffic.json tools/dockergate/contract/testdata "$out"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/tools/dockergate:/src" -v "$out:/contract:ro" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache \
            -e DOCKERGATE_CONTRACT_DIR=/contract "$GO_IMAGE" go test -count=1 ./...

  ci-result:
    # Single stable conclusion the publish gate reads. A release tag runs
    # the full tier: every lane must be success (nothing may skip).
    name: CI result
    if: ${{ !cancelled() }}
    needs: [reuse-check, typecheck, build, tests, tests-other, tests-runner, checks, dockergate, fleetd]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PRIORITY || vars.CI_RUNNER_LIGHT || vars.MYR_RUNNER_LIGHT || '"vps-ci"') }}
    timeout-minutes: 5
    steps:
      - name: Ensure gh and jq (self-hosted runners may lack them)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools-bin"; mkdir -p "$bin"
          if ! command -v jq >/dev/null; then
            # Release assets via the authenticated API: anonymous github.com downloads fail with 504 when GitHub throttles anonymous traffic.
            curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$bin/jq" https://api.github.com/repos/jqlang/jq/releases/assets/140520984
            chmod +x "$bin/jq"
          fi
          if ! command -v gh >/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/gh.tar.gz" https://api.github.com/repos/cli/cli/releases/assets/206502108
            tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/gh_2.62.0_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Load release gate logic from the workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/scripts/myrmidon/release/release-jobs.mjs?ref=$WORKFLOW_SHA" > "$RUNNER_TEMP/release-jobs.mjs"

      - name: Verify queue latency
        if: ${{ needs.reuse-check.outputs.mode == 'full' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          echo "Checking CI result start latency relative to predecessor jobs (fail-closed gate; a runner-queue delay is only a warning)..."
          jobs_file="$RUNNER_TEMP/ci-jobs.json"
          for attempt in 1 2 3; do
            if gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$jobs_file" 2>/dev/null && jq -e '.jobs | length > 0' "$jobs_file" >/dev/null 2>&1; then
              break
            fi
            : > "$jobs_file"
            sleep 2
          done
          if [ ! -s "$jobs_file" ]; then
            echo "ERROR: Unable to fetch job data from GitHub API after retries" >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            export CI_ATTEMPT_STARTED_AT
            CI_ATTEMPT_STARTED_AT="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '.run_started_at // empty')"
            [ -n "$CI_ATTEMPT_STARTED_AT" ] || { echo 'ERROR: Missing attempt start timestamp' >&2; exit 1; }
          fi
          # No checkout: it fails on some self-hosted runners. Read the script of this commit through the API.
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/scripts/myrmidon/ci/queue-metrics.mjs?ref=$WORKFLOW_SHA" > "$RUNNER_TEMP/queue-metrics.mjs"

          # OPE-13002: derive the predecessor set from THIS build's own
          # workflow file (read at the SHA that defines this workflow, even
          # for manual dispatch against a different build target)
          # via release-jobs.mjs instead of hardcoding job names. The set is
          # the CI result gate job's transitive `needs:` closure — exactly
          # the jobs the gate waits for. A workflow job that is NOT in that
          # dependency graph (an extra lane or side job) is never mandatory
          # for the gate; foreign job names are ignored. Matrix lanes (e.g.
          # `tests (${{ matrix.label }})`) are matched by template. An empty
          # or incomplete job set fails closed: if a lane the gate declares
          # is absent from this run, the workflow file is not the one this
          # build started from.
          workflow_yaml="$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/.github/workflows/myrmidon-ci-tag.yml?ref=$WORKFLOW_SHA")"
          if [ -z "$workflow_yaml" ]; then
            echo "ERROR: could not read .github/workflows/myrmidon-ci-tag.yml from the workflow commit to derive the build job set" >&2
            exit 1
          fi

          JOBS_FILE="$jobs_file" BUILD_JOBS_WORKFLOW_YAML="$workflow_yaml" node --input-type=module -e '
            const { gateDependencyJobs, matchesJob, gateState } = await import(`file://${process.env.RUNNER_TEMP}/release-jobs.mjs`);
            const { readFileSync } = await import("node:fs");
            const { calculateCiResultLatency } = await import(`file://${process.env.RUNNER_TEMP}/queue-metrics.mjs`);
            const yaml = process.env.BUILD_JOBS_WORKFLOW_YAML;
            const build = gateDependencyJobs(yaml, "ci-result");
            if (build.length === 0) {
              console.error("ERROR: the CI result gate has no dependency jobs (empty job set)");
              process.exit(1);
            }
            const jobs = JSON.parse(readFileSync(process.env.JOBS_FILE, "utf8")).jobs;
            const observed = jobs
              .filter((j) => j.name !== "CI result")
              .map((j) => ({ name: j.name, conclusion: j.conclusion }));
            const state = gateState(build, observed);
            if (state.missing.length > 0) {
              console.error(`ERROR: build jobs missing from this run: ${state.missing.join(", ")}`);
              process.exit(1);
            }
            if (state.failed.length > 0) {
              console.error(`ERROR: build jobs not successful in this run: ${state.failed.join(", ")}`);
              process.exit(1);
            }
            if (state.foreign.length > 0) {
              console.error(`NOTE: foreign jobs observed and ignored: ${state.foreign.join(", ")}`);
            }
            const allowedPredecessors = [...new Set(jobs.map((j) => j.name))]
              .filter((name) => build.some((expected) => matchesJob(name, expected)));
            const result = calculateCiResultLatency(jobs, {
              workflow: "tag",
              allowedPredecessors,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              attemptStartedAt: process.env.CI_ATTEMPT_STARTED_AT,
            });
            if (result.notApplicable) {
              console.log("NOT_APPLICABLE: no predecessor completed in the current workflow attempt.");
            } else if (!result.passed) {
              console.error(`ERROR: CI result had ${result.residualLatencySeconds}s of latency not explained by the queue (max ${result.maxLatencySec}s).`);
              process.exit(1);
            } else if (result.queueDelayed) {
              console.log(`::warning::CI result latency ${result.latencySeconds}s includes ${result.queueWaitSeconds}s waiting for a runner; residual ${result.residualLatencySeconds}s.`);
            } else {
              console.log(`PASS: CI result started ${result.latencySeconds}s after ${result.lastPredecessorJob} completed.`);
            }
          '

      - name: Verify release build queue priority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: "Myrmidon CI (tag)"
          # OPE-13002 (reviewer finding): the priority guarantee is the
          # dedicated runner pool (vars.CI_RUNNER_PRIORITY). When it is
          # UNSET, every job's runs-on silently degrades to the shared pool
          # labels and the release build has NO priority over ordinary runs.
          # That configuration must not pass: the release build either runs
          # on the priority pool or the tag CI fails closed — the release
          # gate and the publish step refuse a failed/missing tag run, so a
          # release without a guaranteed priority queue never ships.
          PRIORITY_POOL: ${{ vars.CI_RUNNER_PRIORITY }}
        run: |
          set -euo pipefail
          # Fail closed when the priority runner pool is not configured or
          # malformed (single behaviour-level guard implemented in
          # release-jobs.mjs and covered by release-jobs.test.mjs):
          # without the priority pool there is no mechanism that puts the
          # release build ahead of queued ordinary runs.
          PRIORITY_POOL="$PRIORITY_POOL" node --input-type=module -e '
            const { assertPriorityPoolConfigured } = await import(`file://${process.env.RUNNER_TEMP}/release-jobs.mjs`);
            const labels = assertPriorityPoolConfigured(process.env.PRIORITY_POOL);
            console.log(`PASS: priority runner pool configured with label(s): ${labels.join(", ")}`);
          '
          # OPE-13002: release builds of the release-tag CI get priority in the
          # CI queue. The ENFORCEMENT mechanism is the priority runner pool
          # (vars.CI_RUNNER_PRIORITY), a dedicated runner label ordinary runs
          # never receive. BOTH release CI workflows route there:
          #   - this tag workflow: every job's runs-on prepends
          #     vars.CI_RUNNER_PRIORITY (a tag push is always a release build),
          #   - myrmidon-ci.yml: plan.outputs.is_release (true for main pushes
          #     AND release PRs) routes those runs to the same pool.
          # A free priority runner always starts the OLDEST queued release run
          # before any ordinary run; ordinary runs only ever hold the shared
          # pool. This step is the fail-closed OBSERVED-ORDER monitor of that
          # invariant: it fails the release build when the FACTUAL dispatch
          # order (started_at recorded by the dispatcher) proves a release
          # run is waiting behind an ordinary run that queued LATER. No
          # assumed queue positions are used — only recorded start facts.
          echo "Checking release build queue priority (observed dispatch order, fail-closed)..."
          if ! command -v gh >/dev/null || ! command -v jq >/dev/null; then
            echo "ERROR: gh or jq not available for queue priority check" >&2
            exit 1
          fi

          # Filter by state at the API so completed history cannot exhaust
          # the bound. Fail closed if either competing set may be truncated.
          runs_json='{"workflow_runs":[]}'
          for status in queued in_progress; do
          for page in 1 2 3; do
            page_json="$(gh api "repos/$REPO/actions/runs?per_page=100&status=$status&page=$page" 2>/dev/null || true)"
            if [ -z "$page_json" ]; then
              echo "ERROR: Unable to fetch workflow runs from GitHub API (page $page)" >&2
              exit 1
            fi
            runs_json="$(RUNS_A="$runs_json" RUNS_B="$page_json" node --input-type=module -e '
              const a = JSON.parse(process.env.RUNS_A);
              const b = JSON.parse(process.env.RUNS_B);
              if (!Array.isArray(b.workflow_runs)) throw new Error("invalid workflow runs response");
              a.workflow_runs.push(...b.workflow_runs);
              console.log(JSON.stringify(a));
            ')" || {
              echo "ERROR: failed to merge workflow run pages" >&2
              exit 1
            }
            has_more="$(PAGE_JSON="$page_json" node --input-type=module -e '
              const d = JSON.parse(process.env.PAGE_JSON);
              console.log(d.workflow_runs.length >= 100 ? "yes" : "no");
            ')"
            if [ "$has_more" != "yes" ]; then
              break
            fi
            if [ "$page" = "3" ]; then
              echo "ERROR: more than 300 workflow runs reported; refusing to evaluate queue priority on a truncated set (fail closed)" >&2
              exit 1
            fi
          done
          done

          RUNS_JSON="$runs_json" WORKFLOW_NAME="$WORKFLOW" node --input-type=module -e '
            const { observedPriorityViolations } = await import(`file://${process.env.RUNNER_TEMP}/release-jobs.mjs`);
            // The release build competes in the SAME priority runner pool as
            // every other release run (main pushes and release PRs from
            // myrmidon-ci.yml, plus the tag workflow itself). Ordinary runs
            // of the shared CI workflow never receive the priority label.
            // The comparison set is every queued or in-progress run of the
            // two release CI workflows — a run of an unrelated workflow
            // (image, publish, pages) never occupies the pool and is dropped.
            const all = JSON.parse(process.env.RUNS_JSON).workflow_runs;
            const pending = all.filter((r) =>
              (r.status === "queued" || r.status === "in_progress") &&
              (r.name === process.env.WORKFLOW_NAME || r.name === "Myrmidon CI")
            );
            if (pending.length === 0) {
              console.log("PASS: no pending runs competing for the priority pool; queue priority trivially holds.");
              process.exit(0);
            }
            const violations = observedPriorityViolations(pending);
            for (const v of violations) {
              console.error(`ERROR: release run ${v.release} (queued ${v.releaseQueuedAt}, not yet started) is behind ordinary run ${v.blockedBy} (queued ${v.blockedByQueuedAt}, started ${v.blockedByStartedAt})`);
            }
            if (violations.length > 0) {
              console.error(`ERROR: ${violations.length} proven queue priority inversion(s); release builds must be dispatched before later-queued ordinary builds`);
              process.exit(1);
            }
            const rel = pending.filter((r) => /^myr-v\d+\.\d+\.\d+(-rc\.\d+)?$/.test(r.head_branch || "")).length;
            const ord = pending.length - rel;
            console.log(`PASS: ${rel} release run(s) and ${ord} ordinary run(s) pending in the priority pool; no factual dispatch inversion observed.`);
            console.log("PASS: release builds hold queue priority (priority runner pool; observed dispatch order).");
          ' || {
            echo "ERROR: failed to verify release build queue priority" >&2
            exit 1
          }

      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # reuse: the lanes are skipped and the green of the branch run of the
          # same commit stands (the reuse-check job itself must be success).
          # full: every lane must be success (nothing may skip).
          echo "$RESULTS" | jq -e '
            .["reuse-check"].result == "success"
            and (if .["reuse-check"].outputs.mode == "reuse" then true
                 else all(to_entries[]; .value.result == "success") end)
          ' > /dev/null
