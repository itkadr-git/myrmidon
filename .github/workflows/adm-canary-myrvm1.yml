name: ADM canary myr-vm1 runners
# 30.10 ADM: one-off check that the own myr-vm1 runners can run the typecheck steps in parallel. Branch-only; delete after.
on:
  push:
    branches: [adm/canary-myrvm1-20261030]
jobs:
  canary:
    strategy:
      fail-fast: false
      matrix: { n: [1, 2, 3] }
    runs-on: [self-hosted, myr-vm1]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
