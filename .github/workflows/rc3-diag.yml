name: rc3-diag
on:
  pull_request:
    paths: [".github/workflows/rc3-diag.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: diag-${{ matrix.n }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_TESTS || '"ubuntu-latest"') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: loop
        run: |
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          fails=0
          for i in $(seq 1 12); do
            echo "=== iteration $i"
            if ! pnpm exec vitest run --project @paperclipai/server --no-file-parallelism --maxWorkers=1 server/src/__tests__/heartbeat-dependency-scheduling.test.ts > /tmp/out.$i.log 2>&1; then
              fails=$((fails+1)); echo "FAILED iteration $i"; grep -A40 "RC3DIAG" /tmp/out.$i.log | head -120; grep -n "AssertionError" -A4 /tmp/out.$i.log | head -20
            fi
          done
          echo "total failures: $fails"
