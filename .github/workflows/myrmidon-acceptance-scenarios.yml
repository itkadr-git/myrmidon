name: Myrmidon Acceptance Scenarios CI Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: myrmidon-acceptance-scenarios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-acceptance-scenarios:
    # Both environments use the isolated, ephemeral internal runner group.
    # Only the external-PR environment requires maintainer approval.
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'myrmidon-acceptance-trusted' || 'myrmidon-acceptance-external' }}
    runs-on:
      group: myrmidon-acceptance
      labels: [self-hosted, myrmidon-acceptance-ephemeral]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable base (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify acceptance documents
        run: node .github/scripts/acceptance-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Title/body of the triggering event itself: the gate binds its
          # result to these values and fails closed when the live PR has
          # moved on (stale or overlapping edited runs).
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          MYRMIDON_API_URL: ${{ secrets.MYRMIDON_ACCEPTANCE_API_URL }}
          MYRMIDON_API_KEY: ${{ secrets.MYRMIDON_ACCEPTANCE_API_KEY }}
          MYRMIDON_COMPANY_ID: ${{ vars.MYRMIDON_ACCEPTANCE_COMPANY_ID }}
