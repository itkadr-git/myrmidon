name: Myrmidon extension

# The Chrome/Edge extension of the browser bridge (extension/). Typecheck, unit
# tests (vitest with injected ports: no real Chrome, no real signing hardware)
# and the unpacked build. manifest.spec.ts asserts the permission set, so a
# manifest change that widens it fails here.

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/myrmidon-extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/myrmidon-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myrmidon-extension-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    name: extension typecheck, test, build
    if: ${{ github.repository == 'itkadr-git/myrmidon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Test
        working-directory: extension
        run: npm test

      - name: Build
        working-directory: extension
        run: npm run build
