name: OOM detector focused tests
on:
  pull_request:
    paths:
      - 'server/src/myrmidon/bot-containers/container-oom*'
      - 'server/src/myrmidon/bot-containers/docker-driver.ts'
      - 'tools/dockergate/internal/upstream/**'
      - '.github/workflows/oom-detector.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myrmidon/server exec vitest run src/myrmidon/bot-containers/container-oom.myrmidon.test.ts src/myrmidon/bot-containers/container-oom-store.myrmidon.test.ts
      - run: go test ./internal/upstream
        working-directory: tools/dockergate
